<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한월환해도</title>
    <link rel="icon" href="hanwol-icon.png" type="image/png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --panel-bg: #2b2b2b;
            --border-color: #000000;
            --highlight: #FFD700;
            --text-color: #e0e0e0;
        }

        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #wrapper { display: flex; width: 100vw; height: 100vh; }

        /* 사이드바 스타일 */
        #sidebar { 
            width: 300px; background: var(--panel-bg); border-right: 6px solid var(--border-color); 
            color: var(--text-color); transition: width 0.3s ease; overflow: hidden;
        }
        .sidebar-header { 
            padding: 20px; background: #333; border-bottom: 4px solid var(--border-color);
            color: var(--highlight); font-weight: bold; display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-content { padding: 15px; }

        /* 지도 영역 */
        #map-container { flex-grow: 1; position: relative; border-left: 2px solid #444; }
        #map { width: 100%; height: 100%; cursor: crosshair !important; }

        /* 마인크래프트풍 버튼 */
        #toggle-btn, #open-btn {
            background: #4a4a4a; color: var(--highlight); border: 2px solid var(--border-color);
            font-weight: bold; cursor: pointer; padding: 5px 12px;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #888;
        }
        #toggle-btn:hover, #open-btn:hover { background: #5a5a5a; }

        #open-btn {
            display: none; position: absolute; left: 10px; top: 10px; z-index: 1000; padding: 10px 15px;
        }

        /* 검색창 */
        .search-box {
            width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box;
            background: #111; border: 2px inset var(--border-color); color: #fff;
        }
        .search-box:focus { outline: none; border-color: var(--highlight); }

        /* 필터 아이템 */
        .filter-item { 
            background: #444; border: 2px outset #666; margin-bottom: 8px; padding: 12px; 
            color: var(--text-color); cursor: pointer; font-weight: bold; text-align: center;
        }
        .filter-item:hover { background: #555; border-color: var(--highlight); color: var(--highlight); }

/* Leaflet 기본 속성 제거 */
.leaflet-control-attribution {
    background: none !important;      /* 하얀 배경 제거 */
    box-shadow: none !important;      /* 그림자 제거 */
    border: none !important;          /* 테두리 제거 */
    padding: 0 !important;            /* 여백 제거 */
}

        /* 오른쪽 하단 UI (줌 컨트롤 + 로고) */
        .leaflet-bottom.leaflet-right {
            display: flex !important;
            flex-direction: column-reverse !important; 
            align-items: flex-end !important;
            gap: 10px !important;
            margin-bottom: 10px !important;
            margin-right: 10px !important;
        }

        .forky-attribution { 
            display: flex !important; align-items: center !important; gap: 8px !important; 
            font-size: 14px !important; color: #fff !important; font-weight: bold !important; 
            background: rgba(0, 0, 0, 0.8) !important; padding: 6px 12px !important; 
            border-radius: 4px !important; border: 2px solid #444 !important;
        }

        .forky-attribution img { 
            width: 24px !important; height: 24px !important; object-fit: contain !important; 
        }

        .leaflet-control-zoom { border: none !important; box-shadow: none !important; }


    </style>
</head>
<body>
    <div id="wrapper">
        <div id="sidebar">
            <div class="sidebar-header">
                <span>한월서버 맵지도</span>
                <button id="toggle-btn">◀</button>
            </div>
            <div class="sidebar-content">
                <input type="text" id="search-input" placeholder="Search..." class="search-box">
                <div class="icon-grid">
        <button class="icon-btn" id="btn-quest"><img src="images/icon/quest.png" alt="퀘스트"></button>
        <button class="icon-btn" id="btn-youngdan"><img src="images/icon/youngdan.png" alt="영단"></button>
        <button class="icon-btn" id="btn-skill"><img src="images/icon/skill.png" alt="스킬"></button>
        <button class="icon-btn" id="btn-blacksmith"><img src="images/icon/blacksmith.png" alt="대장장이"></button>
    </div>
                <div class="filter-item">산/동상</div>
                <div class="filter-item">NPC</div>
                <div class="filter-item">십이지신</div>
                <div class="filter-item">탐색(항아리)</div>
                <div class="filter-item">의문의 상자</div>
                <div class="filter-item">적환단</div>
                <div class="filter-item">광산</div>
                <div class="filter-item">사냥터</div>
                <div class="filter-item">약초</div>
            </div>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
            <button id="open-btn">▶</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map-logic.js"></script>
    <script src="js/ui-control.js"></script>
</body>
</html>
